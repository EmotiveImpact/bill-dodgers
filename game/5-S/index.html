<style>
/* Layout: a full-screen game shell. The 960x540 canvas is scaled to fit; on touch screens the controls sit below it in portrait and over its corners in landscape. */
:root { --bg: #0e1726; --ink: #f5f1ea; --sage: #2d6a4f; --gold: #f4c542; --line: rgba(245,241,234,.22); color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1726; } }
:root[data-theme="dark"] { --bg: #0e1726; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: "Silkscreen", "Courier New", monospace; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
.ctl { position: fixed; display: none; touch-action: none; z-index: 5; }
.touch .ctl { display: block; opacity: .82; }
.touch .btn { display: grid; }
@media (orientation: landscape) { #dpad { width: 140px; height: 140px; } #dpad .l { top: 56px; } #dpad .r { top: 56px; } #dpad .u, #dpad .d { left: 56px; } #dpad .ul { top: 36px; } #dpad .dl { bottom: 36px; } .btn { width: 72px; height: 72px; font-size: 13px; } #bShoot { width: 82px; height: 82px; font-size: 14px; } .touch .ctl { opacity: .62; } }
#turn { position: fixed; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .06em; color: #dce8d3; opacity: .8; display: none; z-index: 4; }
#dpad { width: 168px; height: 168px; border-radius: 50%; background: rgba(14,23,38,.55); border: 2px solid var(--line); }
#dpad i { position: absolute; width: 0; height: 0; border: 14px solid transparent; opacity: .75; }
#dpad .l { left: 16px; top: 70px; border-right-color: var(--ink); border-left-width: 0; }
#dpad .r { right: 16px; top: 70px; border-left-color: var(--ink); border-right-width: 0; }
#dpad .u { top: 16px; left: 70px; border-bottom-color: var(--ink); border-top-width: 0; }
#dpad .d { bottom: 16px; left: 70px; border-top-color: var(--ink); border-bottom-width: 0; }
#dpad b { position: absolute; font-size: 10px; letter-spacing: .06em; opacity: .7; }
#dpad .ul { top: 46px; left: 0; right: 0; text-align: center; }
#dpad .dl { bottom: 46px; left: 0; right: 0; text-align: center; }
#dpad.on-l .l, #dpad.on-r .r, #dpad.on-u .u, #dpad.on-d .d { opacity: 1; filter: drop-shadow(0 0 6px #fff); }
.btn { width: 84px; height: 84px; border-radius: 50%; place-items: center; font: 700 15px "Silkscreen", monospace; letter-spacing: .04em; color: #0e1726; border: 3px solid rgba(0,0,0,.25); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }
#bJump { background: #dce8d3; }
#bShoot { background: var(--gold); width: 96px; height: 96px; font-size: 16px; }
.btn.on { transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); filter: brightness(1.1); }
#top { position: fixed; z-index: 6; display: flex; gap: 8px; }
#top button { font: 700 12px "Silkscreen", monospace; color: var(--ink); background: rgba(14,23,38,.7); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
#top button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
