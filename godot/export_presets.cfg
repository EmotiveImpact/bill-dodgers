; Development presets only. No credentials, team IDs or store submissions.
[preset.0]
name="Android Native Preview"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json,content/levels/*.json,assets/sprites/*.json,assets/audio/*.res,assets/music/*.res,legal/*.txt"
exclude_filter="content/reference/*,tests/*,tools/*,assets/audio/*.wav,assets/music/*.ogg,assets/music/score_manifest.json"
export_path="builds/bill-dodgers-preview.apk"
script_export_mode=2

[preset.0.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0-preview"
package/unique_name="io.ourcommune.billdodgers.preview"
package/name="Bill Dodgers Preview"
package/signed=true
screen/immersive_mode=true
permissions/internet=false

[preset.1]
name="iOS Native Preview"
platform="iOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json,content/levels/*.json,assets/sprites/*.json,assets/audio/*.res,assets/music/*.res,legal/*.txt"
exclude_filter="content/reference/*,tests/*,tools/*,assets/audio/*.wav,assets/music/*.ogg,assets/music/score_manifest.json"
export_path="builds/ios/bill-dodgers-preview.zip"
script_export_mode=2

[preset.1.options]
application/app_store_team_id=""
application/bundle_identifier="io.ourcommune.billdodgers.preview"
application/signature=""
application/short_version="0.1.0"
application/version="1"
application/export_method_debug=1
application/export_method_release=0

; Separate browser demo. Does not replace the original Canvas web deployment.
[preset.2]
name="Web Demo"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json,content/levels/*.json,assets/sprites/*.json,assets/audio/*.res,assets/music/*.res,legal/*.txt"
exclude_filter="content/reference/*,tests/*,tools/*,assets/audio/*.wav,assets/music/*.ogg,assets/music/score_manifest.json"
export_path="builds/web-demo/index.html"
script_export_mode=2

[preset.2.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
; Source paintings use lossless textures, not platform VRAM compression.
; Enabling ETC2 here without its project importer makes Godot reject export.
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"robots\" content=\"noindex,nofollow\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
